name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Build, test, vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Dorksmith.sln
      - run: dotnet build Dorksmith.sln -c Release --no-restore
      - run: dotnet test Dorksmith.sln -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Dependency vulnerability scan
        run: |
          dotnet list Dorksmith.sln package --vulnerable --include-transitive | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "::error::Vulnerable NuGet packages found"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  frontend:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/tests/package-lock.json
      - run: dotnet build src/Dorksmith.Api/Dorksmith.Api.csproj
      - run: npm ci
        working-directory: web/tests
      - run: npx playwright install --with-deps chromium
        working-directory: web/tests
      - run: npx playwright test
        working-directory: web/tests
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/tests/playwright-report

  containers:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Dorksmith.Api/Dockerfile
          push: false
          tags: dorksmith-api:ci
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          tags: dorksmith-web:ci
