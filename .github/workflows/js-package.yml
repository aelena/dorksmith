name: js-package

on:
  push:
    branches: [main]
    tags: ['js-v*']
    paths: ['packages/dorksmith-js/**', 'data/**', 'tests/Dorksmith.Api.Tests/Golden/**', '.github/workflows/js-package.yml']
  pull_request:
    paths: ['packages/dorksmith-js/**', 'data/**', 'tests/Dorksmith.Api.Tests/Golden/**', '.github/workflows/js-package.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/dorksmith-js

jobs:
  test:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/dorksmith-js/package-lock.json
      - run: npm ci
      - name: Embedded catalogs must match data/
        run: npm run check-catalogs
      - run: npm test
      - name: Package contents preview
        run: npm pack --dry-run

  publish:
    name: Publish to npm (trusted publishing)
    if: startsWith(github.ref, 'refs/tags/js-v')
    needs: test
    runs-on: ubuntu-latest
    # The npm trusted publisher for "dorksmith" is bound to this workflow file name and this environment.
    environment: npm
    permissions:
      contents: read
      id-token: write   # OIDC token exchanged with npm; provenance attestations are generated automatically
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm >= 11.5.1 is required for trusted publishing
        run: npm install -g npm@latest && npm --version
      - run: npm ci
      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#js-v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then echo "::error::tag js-v$tag != package.json $version"; exit 1; fi
      - run: npm run check-catalogs
      - run: npm run build
      - run: npm publish --access public
