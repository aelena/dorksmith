# Production overlay: adds Caddy for automatic TLS in front of the nginx web tier.
#   DORKSMITH_DOMAIN=dorks.example.org docker compose -f compose.yaml -f compose.prod.yaml up -d --build
# Requires a .env with IP_HMAC_SECRET set (see .env.example).
services:
  api:
    environment:
      # Public deployment: pseudonymise client addresses (requires IP_HMAC_SECRET in .env).
      IP_LOGGING_MODE: ${IP_LOGGING_MODE:-Hmac}
      # Two trusted hops in front of the API: caddy -> web (nginx) -> api.
      FORWARD_LIMIT: "2"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  web:
    ports: !reset []
    expose:
      - "8080"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DORKSMITH_DOMAIN: ${DORKSMITH_DOMAIN:?set DORKSMITH_DOMAIN to your public host name}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  caddy-data:
  caddy-config:
