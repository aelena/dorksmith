# Local topology: nginx (web) serves the SPA and proxies /api + /health to the API.
#   docker compose up --build   ->   http://localhost:7077
name: dorksmith

services:
  api:
    build:
      context: .
      dockerfile: src/Dorksmith.Api/Dockerfile
    image: dorksmith-api:local
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-Production}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_PERMIT_LIMIT: ${RATE_LIMIT_PERMIT_LIMIT:-25}
      RATE_LIMIT_WINDOW_MINUTES: ${RATE_LIMIT_WINDOW_MINUTES:-60}
      SEARCH_LOG_RETENTION_DAYS: ${SEARCH_LOG_RETENTION_DAYS:-30}
      IP_LOGGING_MODE: ${IP_LOGGING_MODE:-Hmac}
      IP_HMAC_SECRET: ${IP_HMAC_SECRET:-}
      SQLITE_PATH: /app/state/dorksmith.db
      MAX_QUERY_LENGTH: ${MAX_QUERY_LENGTH:-500}
      MAX_VARIANTS: ${MAX_VARIANTS:-12}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # nginx is the only hop in front of the API inside the Compose network.
      KNOWN_NETWORKS: ${KNOWN_NETWORKS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
    volumes:
      - ./data:/app/data:ro
      - dorksmith-state:/app/state
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./web
    image: dorksmith-web:local
    ports:
      - "${WEB_PORT:-7077}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  dorksmith-state:
